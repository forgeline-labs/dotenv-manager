name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install --upgrade pip flake8

      - name: Setup
        run: python setup

      - name: Lint
        run: flake8 src tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Native Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = & .\app.cmd --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "dotenv Manager 0.1.0") { throw "launcher failed" }
